[package]
name = "crosstip-axelar"
version = "0.1.0"
edition = "2021"
authors = ["CrossTip Team"]

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "20.0.0"
# Add Axelar dependencies when available
# axelar-soroban-sdk = "0.1.0"  # Placeholder - use actual version when available

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true